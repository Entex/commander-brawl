<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101217" />
    <title>Commander Brawl camera</title>
  </head>
  <body>
    <main class="phone">
      <video id="preview" autoplay playsinline muted></video>
      <div class="top">
        <div id="status" class="status">Starting…</div>
      </div>
      <div class="bottom">
        <p id="hint" class="hint">Point the camera at your play area. Keep this page open.</p>
        <div class="controls">
          <button id="switch" type="button">Switch camera</button>
          <button id="torch" type="button" hidden>Light</button>
        </div>
        <label id="zoom-row" class="zoom" hidden>
          Zoom
          <input id="zoom" type="range" />
        </label>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
