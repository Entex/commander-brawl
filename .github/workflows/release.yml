# Publishes a release when a version tag is pushed (v0.2.0 for version 0.2.0 in package.json): the app for every
# platform, the install scripts and SHA256SUMS (signed when a release key is configured).
# Installed apps find it when they start; in-app installation requires a trusted signature.
# Every check has to pass first, using the reusable check.yml workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but package.json says $version." >&2
            exit 1
          fi

  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: [version, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The newest 24.x, not an older one the runner has cached: security fixes come in patch releases.
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Package every platform
        run: npm run package

      - name: Sign the version and release checksums
        env:
          CB_RELEASE_SIGNING_KEY: ${{ secrets.CB_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$CB_RELEASE_SIGNING_KEY" ]; then
            node scripts/sign-release.mjs
          else
            echo "No release signing key configured; this release will require manual installation."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Commander Brawl ${GITHUB_REF_NAME#v}" --generate-notes
