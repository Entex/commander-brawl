# Publishes a release when a version tag is pushed (v0.2.0 for version 0.2.0 in package.json): the app for every
# platform, the install scripts and SHA256SUMS. Installed apps find it when they start, and offer to update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check that the tag is the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but package.json says $version." >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      - name: Package every platform
        run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Commander Brawl ${GITHUB_REF_NAME#v}" --generate-notes
